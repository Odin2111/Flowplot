[package]
name = "flowplot"
version = "0.1.0"
edition = "2021"
description = "Rust CFD post-processor; loads Tecplot, VTK, CGNS, and Fluent into one zone/variable model"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cfd", "tecplot", "vtk", "mesh", "post-processing"]
categories = ["science", "parsing"]

[[bin]]
name = "flowplot"
path = "src/bin/flowplot.rs"

[dependencies]
thiserror = "2"
clap = { version = "=4.5.37", features = ["derive"] }
png = "0.17"

[dev-dependencies]

[features]
default = []
# Optional CGNS via system libcgns (requires lib/headers installed).
cgns = []
